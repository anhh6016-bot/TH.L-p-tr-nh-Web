<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi Tiết Sản Phẩm</title>

    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Chi Tiết Sản Phẩm</h1>
    </header>

    <!-- MENU -->
    <nav>
        <ul>
            <li><a href="index.html">Trang Chủ</a></li>
            <li><a href="#">Sản Phẩm</a></li>
            <li><a href="#">Liên Hệ</a></li>
        </ul>
    </nav>

    <!-- TRANG CHI TIẾT -->
    <main class="detail-container">

        <!-- Nút quay lại / Tiếp tục mua sắm (Đã chuyển lên góc hoặc để đầu trang nhìn rất thoáng) -->
        <div class="back-nav">
            <a href="index.html" class="back-link">
                ← Tiếp tục mua sắm
            </a>
        </div>

        <!-- Nội dung chi tiết -->
        <div class="product-detail-wrapper">

            <!-- Hình ảnh -->
            <div class="detail-image">
                <img src="https://picsum.photos/id/684/600/400" alt="Sản phẩm 1">
            </div>

            <!-- Thông tin -->
            <div class="detail-info">

                <h1>Sản Phẩm 1</h1>

                <!-- Giá tiền nổi bật -->
                <p class="price">$100</p>

                <!-- Mô tả -->
                <p class="description">
                    Đây là mô tả chi tiết của sản phẩm 1.
                    Sản phẩm có chất lượng cao, thiết kế đẹp,
                    phù hợp cho nhiều nhu cầu sử dụng khác nhau.
                </p>

                <!-- KHU VỰC NÚT BẤM HÀNH ĐỘNG -->
                <div class="action-buttons">
                    <!-- Nút Thêm Vào Giỏ Hàng (Màu viền cam sang trọng) -->
                    <button class="button button4 btn-add-cart">
                        🛒 Thêm Vào Giỏ Hàng
                    </button>
                    
                    <!-- Nút Mua Ngay (Màu cam rực nguyên bản) -->
                    <button class="button button4 btn-buy-now">
                        ⚡ Mua Ngay
                    </button>
                </div>

            </div>

        </div>

    </main>

    <!-- FOOTER -->
    <footer class="footer">

        <div class="footer-item">
            <h3>Cột 1</h3>
            <p>Nội dung cột 1.</p>
        </div>

        <div class="footer-item">
            <h3>Cột 2</h3>
            <p>Nội dung cột 2.</p>
        </div>

        <div class="footer-item">
            <h3>Cột 3</h3>
            <p>Nội dung cột 3.</p>
        </div>

    </footer>

</body>
</html>
